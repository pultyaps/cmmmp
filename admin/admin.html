<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Управление сайтом</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <header>
    <div class="shell row split">
      <h1>Управление сайтом</h1>
      <div class="row">
        <span id="account"></span> <a href="/" target="_blank" rel="noopener">Открыть сайт</a>
        <form method="post" action="/admin/logout"><button type="submit">Выйти</button></form>
      </div>
    </div>
  </header>
  <main class="shell stack">
    <div class="toolbar stack">
      <div class="row">
        <button id="save" type="button" disabled>Сохранить черновик</button>
        <a href="/?preview=1" target="_blank" rel="noopener">Предпросмотр черновика</a>
        <button id="publish" type="button" class="primary" disabled>Опубликовать</button>
      </div>
      <p id="status" role="status" aria-live="polite">Загрузка содержимого…</p>
    </div>
    <label>Раздел сайта
      <select id="section">
        <option value="news">Новости и семинары</option>
        <option value="contacts">Контакты</option>
        <option value="documents">Документы</option>
        <option value="faculty">Преподаватели</option>
        <option value="leaders">Руководители</option>
        <option value="courses">Учебные курсы</option>
        <option value="faq">Частые вопросы</option>
      </select>
    </label>
    <section id="editor" class="stack" aria-label="Поля раздела"></section>
  </main>
</body>
</html>
